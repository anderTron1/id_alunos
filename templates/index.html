<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Código</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            background: #1e1e1e;
            color: #ccc;
        }

        /* ── Title Bar ── */
        #titlebar {
            height: 30px;
            background: #323233;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ccc;
            user-select: none;
            flex-shrink: 0;
            border-bottom: 1px solid #111;
        }

        /* ── Workbench (activity + sidebar + editor) ── */
        #workbench {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Activity Bar ── */
        #activitybar {
            width: 48px;
            background: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 4px;
            flex-shrink: 0;
        }

        .activity-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.6;
            border-left: 2px solid transparent;
            transition: opacity 0.1s;
        }

        .activity-btn:hover { opacity: 1; }
        .activity-btn.active { opacity: 1; border-left-color: #fff; }

        .activity-btn svg { fill: #ccc; }

        /* ── Sidebar ── */
        #sidebar {
            width: 240px;
            background: #252526;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid #1e1e1e;
        }

        #sidebar-header {
            padding: 10px 12px 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #bbb;
            text-transform: uppercase;
            user-select: none;
        }

        #folder-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 12px 3px 8px;
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
            user-select: none;
            cursor: pointer;
        }

        #folder-row:hover { background: #2a2d2e; }

        #folder-row svg { fill: #e8c000; flex-shrink: 0; }

        #folder-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        #sidebar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 2px 4px;
            gap: 2px;
        }

        .sidebar-action-btn {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0.7;
        }

        .sidebar-action-btn:hover { background: #3a3d3e; opacity: 1; }
        .sidebar-action-btn svg { fill: #ccc; }
        .sidebar-action-btn:disabled, .sidebar-action-btn[disabled] { opacity: 0.3; cursor: default; }
        .sidebar-action-btn[disabled]:hover { background: transparent; }

        #file-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        #file-list::-webkit-scrollbar { width: 6px; }
        #file-list::-webkit-scrollbar-thumb { background: #424242; }

        #file-list li {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 12px 2px 0;
            height: 22px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ccc;
            font-size: 13px;
        }

        #file-list li:hover { background: #2a2d2e; }
        #file-list li.active { background: #094771; color: #fff; }
        #file-list li svg { flex-shrink: 0; }

        #file-list ul { list-style: none; padding: 0; margin: 0; }

        .folder-item { font-weight: 500; }
        .folder-item:hover { background: #2a2d2e; }

        /* ── Editor Container ── */
        #editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        #editor-and-terminal {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Terminal Panel ── */
        #terminal-panel {
            display: none;
            flex-direction: column;
            background: #1e1e1e;
            border-top: 1px solid #333;
            flex-shrink: 0;
            height: 200px;
        }

        #terminal-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252526;
            padding: 0 10px;
            height: 28px;
            font-size: 11px;
            color: #bbb;
            user-select: none;
            flex-shrink: 0;
            cursor: ns-resize;
        }

        #terminal-titlebar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .terminal-tab {
            padding: 4px 0;
            color: #bbb;
            border-bottom: 1px solid transparent;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .terminal-tab.active {
            color: #fff;
            border-bottom-color: #007acc;
        }

        #terminal-close {
            cursor: pointer;
            opacity: 0.6;
            padding: 2px 4px;
            border-radius: 3px;
        }

        #terminal-close:hover { opacity: 1; background: #3a3a3a; }
        #terminal-close svg { fill: #ccc; display: block; }

        #terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            color: #ccc;
        }

        #terminal-output::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-thumb { background: #424242; }

        #terminal-output .out-stdout { color: #d4d4d4; }
        #terminal-output .out-stderr { color: #f48771; }
        #terminal-output .out-warn   { color: #cca700; }
        #terminal-output .out-info   { color: #569cd6; }
        #terminal-output .out-ok     { color: #4ec9b0; }

        /* ── Tabs ── */
        #tabs-bar {
            height: 35px;
            background: #2d2d2d;
            display: flex;
            flex-shrink: 0;
        }

        #tabs-scroll {
            display: flex;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
        }

        #tabs-scroll::-webkit-scrollbar { height: 3px; }
        #tabs-scroll::-webkit-scrollbar-thumb { background: #424242; }

        #editor-actions {
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 4px;
            background: #2d2d2d;
            border-left: 1px solid #1e1e1e;
            flex-shrink: 0;
        }

        #btn-open-browser {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            background: transparent;
            border: 1px solid #555;
            border-radius: 3px;
            color: #ccc;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        #btn-open-browser:hover { background: #3a3a3a; border-color: #777; color: #fff; }
        #btn-open-browser svg { fill: #ccc; }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 10px 0 14px;
            height: 35px;
            min-width: 120px;
            max-width: 200px;
            cursor: pointer;
            background: #2d2d2d;
            border-right: 1px solid #1e1e1e;
            color: #969696;
            font-size: 13px;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
        }

        .tab:hover { background: #353535; color: #ccc; }

        .tab.active {
            background: #1e1e1e;
            color: #fff;
            border-top: 1px solid #007acc;
        }

        .tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .tab-close {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            opacity: 0;
            flex-shrink: 0;
        }

        .tab:hover .tab-close,
        .tab.active .tab-close { opacity: 1; }

        .tab-close:hover { background: #474747; }
        .tab-close svg { fill: #ccc; }

        .tab.modified .tab-name::after {
            content: '●';
            margin-left: 4px;
            color: #e2c08d;
            font-size: 10px;
        }

        /* ── Monaco Editor ── */
        #editor { flex: 1; min-height: 0; }

        /* ── Welcome screen ── */
        #welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555;
            font-size: 14px;
        }

        #welcome svg { fill: #3c3c3c; }

        #welcome p { font-size: 13px; }

        #welcome kbd {
            background: #3a3a3a;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 11px;
            color: #aaa;
        }

        /* ── Status Bar ── */
        #statusbar {
            height: 22px;
            background: #007acc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
            user-select: none;
        }

        #statusbar .left, #statusbar .right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #statusbar span { opacity: 0.9; }
        #statusbar span:hover { opacity: 1; background: rgba(255,255,255,0.1); padding: 0 4px; border-radius: 2px; cursor: pointer; }

        #status-saved {
            background: #16825d !important;
            padding: 0 8px !important;
            border-radius: 2px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Title Bar -->
    <div id="titlebar">Editor de Código</div>

    <!-- Workbench -->
    <div id="workbench">

        <!-- Activity Bar -->
        <div id="activitybar">
            <div class="activity-btn active" title="Explorer">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <path d="M3 3h8v2H5v14h14v-6h2v8H3V3zm10 0h8v8h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H13V3z"/>
                </svg>
            </div>
        </div>

        <!-- Sidebar -->
        <div id="sidebar">
            <div id="sidebar-header">
                Explorer
                <div id="sidebar-actions" style="display:inline-flex; float:right; margin-top:-2px;">
                    <div class="sidebar-action-btn" id="btn-new-file" title="Novo Arquivo" disabled>
                        <svg width="16" height="16" viewBox="0 0 16 16">
                            <path d="M9.5 1.1l3.4 3.5.1.4v2h-1V5H9V2H3v12h5v1H2.5l-.5-.5v-13l.5-.5h6.7l.3.1zM10 2v2h1.9L10 2zm4 11h-2v-2H11v2H9v1h2v2h1v-2h2v-1z"/>
                        </svg>
                    </div>
                    <div class="sidebar-action-btn" id="btn-open-folder" title="Abrir Pasta">
                        <svg width="16" height="16" viewBox="0 0 16 16">
                            <path d="M14.5 3H7.71l-.85-.85L6.51 2h-5l-.5.5v11l.5.5h13l.5-.5v-10L14.5 3zm-.51 8.49V13h-12V7h12v4.49zm0-5.49h-12V3h4.29l.86.85.35.15H14v2.49z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div id="folder-row" style="display:none;">
                <svg width="14" height="14" viewBox="0 0 16 16">
                    <path d="M14.5 3H7.71l-.85-.85L6.51 2h-5l-.5.5v11l.5.5h13l.5-.5v-10L14.5 3zm-1 10h-11V7h11v6zm0-7h-11V3h4.29l.86.85.35.15H13.5v2z"/>
                </svg>
                <span id="folder-name"></span>
            </div>
            <ul id="file-list"></ul>
        </div>

        <!-- Editor -->
        <div id="editor-container">
            <div id="tabs-bar">
                <div id="tabs-scroll"></div>
                <div id="editor-actions">
                    <button id="btn-run" title="Executar Python (F5)" style="display:none;align-items:center;gap:5px;padding:3px 8px;background:#388a34;border:none;border-radius:3px;color:#fff;font-size:11px;cursor:pointer;white-space:nowrap;">
                        <svg width="12" height="12" viewBox="0 0 16 16" style="fill:#fff">
                            <path d="M4 2l10 6-10 6V2z"/>
                        </svg>
                        Executar
                    </button>
                    <button id="btn-open-browser" title="Abrir no navegador">
                        <svg width="13" height="13" viewBox="0 0 16 16">
                            <path d="M14 2H2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zm0 11H2V5h12v8zm0-9H2V3h12v1zM4 4H3V3h1v1zm2 0H5V3h1v1zm2 0H7V3h1v1z"/>
                        </svg>
                        Abrir no navegador
                    </button>
                </div>
            </div>
            <div id="editor-and-terminal">
                <div id="welcome">
                    <svg width="64" height="64" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/>
                    </svg>
                    <p>Abra uma pasta para começar</p>
                    <p><kbd>clique no ícone de pasta</kbd> na barra lateral</p>
                </div>
                <div id="editor" style="display:none; flex:1;"></div>

                <!-- Terminal Panel -->
                <div id="terminal-panel">
                    <div id="terminal-titlebar">
                        <div id="terminal-titlebar-left">
                            <span class="terminal-tab active">SAÍDA</span>
                        </div>
                        <span id="terminal-close" title="Fechar terminal">
                            <svg width="12" height="12" viewBox="0 0 16 16">
                                <path d="M9.4 8l4.3-4.3-1.4-1.4L8 6.6 3.7 2.3 2.3 3.7 6.6 8l-4.3 4.3 1.4 1.4L8 9.4l4.3 4.3 1.4-1.4z"/>
                            </svg>
                        </span>
                    </div>
                    <div id="terminal-output"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Status Bar -->
    <div id="statusbar">
        <div class="left">
            <span id="status-branch">⎇ main</span>
        </div>
        <div class="right">
            <span id="status-saved">✓ Salvo</span>
            <span id="status-position">Ln 1, Col 1</span>
            <span id="status-language">Texto</span>
            <span id="status-encoding">UTF-8</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='cloudflare.js') }}"></script>
    <script src="{{ url_for('static', filename='editor.js') }}"></script>
</body>
</html>
